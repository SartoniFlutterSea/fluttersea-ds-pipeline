# Compila il sito di documentazione dagli artefatti estratti e lo pubblica.
#
# Le pagine non stanno in repo: si rigenerano qui da data/contracts/, che
# resta l'unica fonte.

name: Storybook

on:
  push:
    branches: [main]
    paths:
      - 'data/contracts/**'
      - 'storybook/**'
      - '.storybook/**'
      - 'scripts/build-stories.mjs'
      - 'package.json'
      - '.github/workflows/storybook.yml'
  pull_request:
    paths:
      - 'data/contracts/**'
      - 'storybook/**'
      - '.storybook/**'
  workflow_dispatch:

concurrency:
  group: storybook-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run build-storybook

      - name: Prepara per Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: storybook-static

      # Sulle proposte il sito non si pubblica: resta scaricabile dal run,
      # cosi' si verifica che compili prima di unire.
      - name: Artefatto della proposta
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: storybook-pr-${{ github.event.number }}
          path: storybook-static
          retention-days: 7

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
